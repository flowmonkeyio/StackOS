schema_version: stackos.workflow-template.v1
key: core.project-setup
name: Project Setup and Update
version: 0.1.0
description: Prepare selected project workflows and verify their readiness through tracked delivery.
domain: core
owner:
  team: StackOS
experience:
  problem: Project setup and guidance updates need visible work, evidence and recovery.
  outcome: Selected workflows have checked guidance and current readiness evidence.
  operator_path:
    - Start Setup or Update in the project console.
    - Follow the linked Work task and answer any bounded setup question.
    - Inspect each workflow's readiness before starting its business work.
  agent_path:
    - Follow the canonical project_setup_method for the admitted scope.
    - Preserve compatible local choices while preparing the selected workflows.
    - Verify only missing current claims and return evidence through the owning tickets.
public:
  audience: Operators setting up or updating a project's workflow guidance
  setup: available
  prerequisites:
    - An existing project with an available selected folder
    - An authorized console Setup or Update request
  proof:
    - The actual setup run, task and native receipts
    - Current per-workflow preparation and activation evidence
  featured: false
when_to_use:
  - The project console admits managed Setup or Update through this control run.
when_not_to_use:
  - Do not select this as a project's business workflow to adapt or execute.
  - Do not start another copy inside an already admitted setup run.
skill_preset_requirements:
  - skill_preset_ref: stackos.workflow-orchestrator
    requirement: required
    purpose: Retain canonical workflow ownership and bounded handoffs while the project_setup_method owns setup behavior.
steps:
  - id: prepare
    title: Prepare project workflows
    purpose: Adapt the selected method and identify only the missing readiness checks.
    instructions:
      - Resolve workflowTemplate.authoringGuide and consume its complete project_setup_method.
      - Inspect current project guidance and preserve compatible settings and local choices.
      - Return setup_report with selected workflows, prepared evidence, any adoption proposal and explicit missing workflow_checks.
      - A question returns blocked with a concrete needs_input report; do not wait for an answer.
      - Do not start business workflows or change your own task lifecycle.
    output_refs: [setup_report]
    success_criteria:
      - The selected workflows are prepared and the missing bounded proof is explicit.
  - id: activate-verify
    title: Verify project readiness
    purpose: Verify only missing current claims using the selected actual roles and saved defaults.
    depends_on: [prepare]
    instructions:
      - Consume current prepared evidence, canonical saved defaults and completed check references.
      - Execute only assigned missing bounded checks under your actual native settings.
      - Return setup_activation_checks with claims, status, environment_ref and evidence_ref when executing a selected check.
      - Return a success setup_report only when all requested readiness claims are covered; the owner binds your actual completed invocation.
      - Do not invent completed references, launch business work or repeat accepted proof.
    output_refs: [setup_report]
    success_criteria:
      - Required setup evidence is current, complete and bound to actual native consumption.
outputs:
  - key: setup_report
    name: Setup report
    type: object
    required: true
    description: The existing project setup report, validated against the protected admission.
    schema: {type: object}
metadata:
  builtin: true
  setup_control: true
