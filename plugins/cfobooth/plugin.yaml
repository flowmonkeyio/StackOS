slug: cfobooth
name: CFOBooth
version: 0.1.0
display_order: 48
description: Discover and call the configured CFOBooth organization's API using a verified Account.
source: builtin
capabilities:
  - key: organization-api
    name: Organization API
    description: Explicit catalog synchronization and scoped API actions.
    kind: integration
providers:
  - key: cfobooth
    name: CFOBooth
    auth_catalog_ref: cfobooth
actions:
  - key: catalog.sync
    name: Sync CFOBooth catalog
    description: Fetch one complete permission-filtered catalog and update this verified Account's scoped actions.
    provider: cfobooth
    capability: organization-api
    risk_level: write
    input_schema:
      type: object
      additionalProperties: false
      properties:
        operation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 512}
    output_schema: {type: object, additionalProperties: true}
    config:
      schema_version: stackos.action.v1
      connector: cfobooth
      operation: catalog.sync
      requires_credential: true
      provider_context_schema: {type: object, additionalProperties: false}
config:
  inventory_refresh:
    mode: manual
    action_ref: cfobooth.catalog.sync
