  - key: search-console.batch.read
    name: Read Search Console Batch
    description: Execute 1 to 1000 typed Search Console reads with one Account. Each item consumes quota; execution order is not guaranteed. Partial and unknown outcomes require inspection before retrying.
    provider: google-search-console
    capability: seo-measurement
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [operation, input]
                properties:
                  operation: {const: sites.list}
                  input: *gsc_sites_input
              - type: object
                additionalProperties: false
                required: [operation, input]
                properties:
                  operation: {const: search_analytics.query}
                  input: *gsc_analytics_input
              - type: object
                additionalProperties: false
                required: [operation, input]
                properties:
                  operation: {const: sitemaps.list}
                  input: *gsc_sitemaps_input
              - type: object
                additionalProperties: false
                required: [operation, input]
                properties:
                  operation: {const: url.inspect}
                  input: *gsc_inspection_input
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: google-search-console
      operation: batch.read
      requires_credential: true
