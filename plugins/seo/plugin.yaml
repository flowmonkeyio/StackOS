      budget_kind: dataforseo
      enforce_budget: true
  - key: serp.analyze
    name: Analyze SERP
    description: Fetch live SERP result evidence for an agent-selected query through DataForSEO; StackOS caps depth at 100 results for bounded agent calls.
    provider: dataforseo
    capability: seo-research
    risk_level: cost
    input_schema:
      type: object
      additionalProperties: false
      required:
        - keyword
      properties:
        keyword:
          type: string
        location_name:
          type: string
          description: DataForSEO location_name country value, for example United States.
          enum: *dataforseo_country_location_names
        language_code:
          type: string
          description: DataForSEO language_code, for example en.
          enum: *dataforseo_google_language_codes
        depth:
          type: integer
          minimum: 1
          maximum: 100
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: dataforseo
      operation: serp.analyze
      requires_credential: true
      budget_kind: dataforseo
      enforce_budget: true
  - key: paa.extract
    name: Extract People Also Ask
    description: Fetch People Also Ask evidence for an agent-selected query through DataForSEO.
    provider: dataforseo
    capability: seo-research
    risk_level: cost
    input_schema:
      type: object
      additionalProperties: false
      required:
        - keyword
      properties:
        keyword:
          type: string
        location_name:
          type: string
          description: DataForSEO location_name country value, for example United States.
          enum: *dataforseo_country_location_names
        language_code:
          type: string
          description: DataForSEO language_code, for example en.
          enum: *dataforseo_google_language_codes
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: dataforseo
      operation: paa
      requires_credential: true
      budget_kind: dataforseo
      enforce_budget: true
  - key: serper.search
    name: Search Google With Serper
    description: Fetch live Google Search result evidence through Serper.dev using bounded query and locale inputs.
    provider: serper
    capability: seo-research
    risk_level: cost
    input_schema:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
        num:
          type: integer
          minimum: 1
          maximum: 100
        country:
          type: string
          description: Optional Google country code sent as gl.
        language:
          type: string
          description: Optional Google language code sent as hl.
        page:
          type: integer
          minimum: 1
          maximum: 10
        tbs:
          type: string
          description: Optional Google time/filter expression.
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: serper
      operation: search
      requires_credential: true
      budget_kind: serper
      enforce_budget: false
  - key: competitor.keywords
    name: Competitor Keywords
    description: Pull competitor organic keyword evidence for agent analysis; StackOS captures Ahrefs API-unit headers while monetary budget enforcement remains disabled until API units are modeled.
    provider: ahrefs
    capability: seo-research
    risk_level: cost
    input_schema:
      type: object
      additionalProperties: false
      required:
        - target
      properties:
        target:
          type: string
        country:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: "Ahrefs plan row caps are enforced at runtime: Lite 100, Standard 250, Advanced 500, Enterprise bounded by the StackOS action cap of 1000."
        date:
          type: string
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: ahrefs
      operation: competitor.keywords
      requires_credential: true
      budget_kind: ahrefs
      enforce_budget: false
  - key: backlink.research
    name: Backlink Research
    description: Pull backlink evidence for an agent-defined SEO investigation; StackOS captures Ahrefs API-unit headers while monetary budget enforcement remains disabled until API units are modeled.
    provider: ahrefs
    capability: seo-research
    risk_level: cost
    input_schema:
      type: object
      additionalProperties: false
      required:
        - target
      properties:
        target:
          type: string
        mode:
          type: string
          enum:
            - exact
            - prefix
            - domain
            - subdomains
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: "Ahrefs plan row caps are enforced at runtime: Lite 100, Standard 250, Advanced 500, Enterprise bounded by the StackOS action cap of 1000."
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: ahrefs
      operation: backlink.research
      requires_credential: true
      budget_kind: ahrefs
      enforce_budget: false
  - key: search-console.sites.list
    name: List Search Console Sites
    description: List verified Search Console sites and permission levels for the connected Google account.
    provider: google-search-console
    capability: seo-measurement
    risk_level: read
    input_schema: &gsc_sites_input
      type: object
      additionalProperties: false
      properties: {}
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: google-search-console
      operation: sites.list
      requires_credential: true
      required_scopes:
        - https://www.googleapis.com/auth/webmasters.readonly
      budget_kind: google-search-console
      enforce_budget: false
  - key: search-console.search-analytics.query
    name: Query Search Console Search Analytics
    description: Query Search Console top-row performance data for a verified URL-prefix or domain property.
    provider: google-search-console
    capability: seo-measurement
    risk_level: read
    input_schema: &gsc_analytics_input
      type: object
      additionalProperties: false
      required:
        - site_url
        - start_date
        - end_date
      properties:
        site_url:
          type: string
          description: Verified URL-prefix property ending in / or sc-domain:example.com property.
        start_date:
          type: string
        end_date:
          type: string
        dimensions:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - web
            - image
            - video
            - news
            - discover
            - googleNews
        dimension_filter_groups:
          type: array
          items:
            type: object
            additionalProperties: true
        aggregation_type:
          type: string
          enum:
            - auto
            - byProperty
            - byPage
            - byNewsShowcasePanel
        row_limit:
          type: integer
          minimum: 1
          maximum: 25000
        start_row:
          type: integer
          minimum: 0
        data_state:
          type: string
          enum:
            - final
            - all
            - hourly_all
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: google-search-console
      operation: search_analytics.query
      requires_credential: true
      required_scopes:
        - https://www.googleapis.com/auth/webmasters.readonly
      budget_kind: google-search-console
      enforce_budget: false
  - key: search-console.sitemaps.list
    name: List Search Console Sitemaps
    description: List sitemap metadata for a verified Search Console property.
    provider: google-search-console
    capability: seo-measurement
    risk_level: read
    input_schema: &gsc_sitemaps_input
      type: object
      additionalProperties: false
      required:
        - site_url
      properties:
        site_url:
          type: string
        sitemap_index:
          type: string
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: google-search-console
      operation: sitemaps.list
      requires_credential: true
      required_scopes:
        - https://www.googleapis.com/auth/webmasters.readonly
      budget_kind: google-search-console
      enforce_budget: false
  - key: search-console.sitemaps.submit
    name: Submit Search Console Sitemap
    description: Submit or resubmit one existing sitemap URL to Google. This registers the URL; it does not edit the sitemap or guarantee crawling or indexing.
    provider: google-search-console
    capability: seo-measurement
    risk_level: write
    input_schema: &gsc_submit_input
      type: object
      additionalProperties: false
      required: [site_url, sitemap_url]
      properties:
        site_url: {type: string}
        sitemap_url: {type: string}
    output_schema: *object_schema
    config:
      schema_version: stackos.action.v1
      connector: google-search-console
      operation: sitemaps.submit
      requires_credential: true
      required_scopes: [https://www.googleapis.com/auth/webmasters]
      budget_kind: google-search-console
      enforce_budget: false
  - key: search-console.url.inspect
    name: Inspect Search Console URL
    description: Read Google's indexed-version URL Inspection result for a URL under a verified property.
    provider: google-search-console
