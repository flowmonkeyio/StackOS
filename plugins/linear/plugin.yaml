    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [team_ref]
      properties:
        team_ref: &linear_ref
          type: string
          pattern: "^provider-object:[A-Za-z0-9_-]+$"
          maxLength: 120
    output_schema: *linear_safe_output
    config:
      schema_version: stackos.action.v1
      connector: linear
