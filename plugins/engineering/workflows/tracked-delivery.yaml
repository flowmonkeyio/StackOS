schema_version: stackos.workflow-template.v1
key: engineering.tracked-delivery
name: Engineering Tracked Delivery
version: 0.5.0
description: 'Five-step engineering delivery: clarify intent, implement and document, observe behavior, independently
  review, and hand off truthfully.'
domain: engineering
owner:
  team: StackOS
experience:
  problem: Engineering work can drift from the original request or be called done without observing its real behavior.
  outcome: The requested behavior is implemented, documented, observed through its consumer, independently reviewed,
    and reported with gaps.
  operator_path:
  - State the desired behavior and constraints.
  - Answer material ambiguity or approval questions.
  - Inspect the observed result and remaining gaps.
  agent_path:
  - Clarify the original request; stop affected work and ask when intent is ambiguous, including mid-work.
  - Implement and document the smallest agreed change.
  - Sanity-check the relevant consumer or loaded app; record what actually happened.
  - Have a different agent review the exact candidate against the original request.
  - Report the result, proof, gaps, and release authority without calling unproved behavior done.
  progress_signals:
  - Intent clear
  - Implementation and docs complete
  - Behavior observed or gap recorded
  - Independent review complete
  - Handoff recorded
  recovery:
  - Keep blockers, failed attempts, and ownership in the existing run and tracker.
  - Existing plans retain their frozen steps and grants; a new template never rewrites them.
  safe_stopping_points:
  - Pause only affected work for unresolved intent, missing authority, or unsafe/unknown effects.
public:
  audience: Product and engineering teams delivering repository changes
  setup: available
  prerequisites:
  - Repository instructions and source access
  - A desired outcome and acceptance boundary
  - Authority for the requested file or system changes
  proof:
  - Original request and constraints
  - Changed candidate and documentation
  - Observed consumer or loaded-app behavior
  - Independent review
  - Truthful gaps and release state
  featured: true
when_to_use:
- A user explicitly requests an engineering workflow, StackOS workflow, or tracked delivery for a code change.
- Engineering work needs durable implementation, behavior verification, independent review, and a truthful release
  handoff.
when_not_to_use:
- The request is one explicit provider/tool action with no durable delivery state.
- The project already has a more specific domain workflow template that fully covers the work.
- The change is a tiny local edit where project policy allows chat-only execution and no durable tracker state is
  useful.
agent_requirements:
- role: delivery
  requirement: required
  agent_preset_ref: stackos.sdlc.delivery
  purpose: Implement and document assigned work; return the exact candidate and sanity evidence.
  applies_to_steps:
  - deliver-tickets
- role: delivery-reviewer
  requirement: required
  agent_preset_ref: stackos.sdlc.delivery-reviewer
  purpose: Independently compare the exact candidate and observed behavior with the original request.
  applies_to_steps:
  - review-delivery
skill_requirements:
- skill_ref: stackos:stackos
  requirement: required
  purpose: Teach the main agent how to operate StackOS MCP, engineering workflows, run plans, tracker tasks/tickets,
    dependencies, and evidence.
  setup_notes:
  - Use the existing StackOS project, effective workflow, frozen run, and relevant project guidance.
  - Keep the main agent responsible for scope, run and tracker writes, integration, and final claims.
  - Use only currently granted tools; a template or preset never grants credentials, file access, or release authority.
skill_preset_requirements:
- skill_preset_ref: stackos.sdlc.delivery-orchestrator
  requirement: required
  purpose: Give the main agent a small, project-adapted loop for intent, implementation, actual behavior, review,
    and handoff.
  applies_to_steps:
  - scope-work
  - deliver-tickets
  - verify-delivery
  - review-delivery
  - release-closeout
  setup_notes:
  - Adapt this main-agent guidance to the project; it is not a subagent.
  - Read the frozen run before resuming; existing plans retain their original step order and outputs.
inputs:
- key: goal
  name: Goal
  type: string
  required: true
  description: Engineering outcome requested by the user or upstream workflow.
- key: repo_context
  name: Repository Context
  type: object
  required: false
  description: Optional known stack, docs, constraints, or host-agent format supplied by the caller.
- key: release_intent
  name: Release Intent
  type: string
  required: false
  description: Optional target release, branch, commit, or rollout expectation.
context_requirements:
- id: current_tracker
  source: resources
  purpose: Use existing tracker-related resources or imported planning context when present before creating new
    work.
  filters:
    plugin_slug: engineering
    resource_keys:
    - engineering-decision
    - engineering-evidence
  fields:
  - resource_key
  - title
  - status
  - data_json
  - updated_at
  max_items: 20
  return_mode: compact
- id: recent_runs
  source: runs
  purpose: Check recent run evidence and failed signoffs before repeating delivery work.
  fields:
  - kind
  - status
  - last_step
  - metadata_json
  max_items: 10
  return_mode: compact
- id: recent_decisions
  source: decisions
  purpose: Reuse accepted technical or release decisions that constrain implementation.
  fields:
  - title
  - decision
  - rationale
  - status
  - tags
  max_items: 10
  return_mode: compact
capability_requirements:
- key: engineering-delivery
  required: true
  description: Tracker-backed planning, delivery, review, and release flow for engineering work.
- key: engineering-review
  required: true
  description: Architecture, QA, integration contract, security, tracker truth, and release-readiness review.
resource_contracts:
- key: decisions
  resource: engineering-decision
  purpose: Store durable design or release decisions when the run creates reusable engineering rationale.
- key: evidence
  resource: engineering-evidence
  purpose: Store verification and signoff evidence when the run creates reusable evidence records.
policies:
- key: intent_first
  kind: requirements
  description: Use the original operator request and amendments. If intended behavior is ambiguous, stop affected
    work and ask; independent clear work may continue.
- key: one_owner
  kind: orchestration
  description: Use the existing project owner and run/tracker state. The main agent controls lifecycle, integration,
    and final claims; specialists return bounded evidence.
- key: authority
  kind: boundary
  description: Preserve scoped grants, approvals, ownership, and release authority. Do not infer permissions from
    a workflow step or technical readiness.
- key: real_behavior
  kind: verification
  description: Complete implementation and documentation before sanity checks. Observe the actual integrated consumer
    or loaded app for requested app behavior; unit tests alone are insufficient.
- key: independent_review
  kind: review
  description: A different agent reviews the exact candidate against the original request and actual observations;
    the main agent adjudicates findings.
- key: truthful_handoff
  kind: delivery
  description: Preserve failures and uncertainty. State changes, observed evidence, gaps, and release state; do
    not report an unproved outcome as complete.
steps:
- id: scope-work
  title: Clarify Intent
  purpose: Understand the original request, constraints, authority, and what behavior would demonstrate success.
  instructions:
  - Read the original request, current amendments, project guidance, existing owner and consumer. Reuse the current
    run/tracker work rather than duplicating it.
  - An explicit StackOS workflow request requires a real run before tracker tickets; record tooling failure and any
    manual fallback separately, never as flow execution.
  - If intended behavior is ambiguous now or later, stop only affected work and ask the operator. Record the question
    and continue independent clear work.
  - Name the smallest agreed change, relevant real-flow sanity check, reviewer, and any missing authority before
    implementation.
  input_refs:
  - goal
  - repo_context
  - release_intent
  context_refs:
  - current_tracker
  - recent_runs
  - recent_decisions
  policy_refs:
  - intent_first
  - one_owner
  - authority
  output_refs:
  - intent_summary
  success_criteria:
  - Intended behavior and authority are clear; unresolved ambiguity records a blocked step and cannot advance implementation.
- id: deliver-tickets
  title: Implement And Document
  purpose: Make the smallest agreed project-native change and update affected documentation.
  instructions:
  - Use the existing canonical owner and current authority; keep assignments and dependencies in the existing tracker
    when needed.
  - Implement and document before running sanity verification. Do not add unit tests or a test-first phase on agent
    discretion.
  - If intent becomes ambiguous, stop the affected edit and ask the operator; preserve candidate identity, failed
    attempts, and unrelated work.
  policy_refs:
  - intent_first
  - one_owner
  - authority
  depends_on:
  - scope-work
  output_refs:
  - implementation_summary
  success_criteria:
  - Agreed implementation and affected documentation are complete; incomplete work records a blocked or failed step.
- id: verify-delivery
  title: Verify Behavior
  purpose: Sanity-check the integrated consumer or loaded application against the original request.
  instructions:
  - Run relevant existing checks and observe the actual integrated flow; for requested app behavior, observe the
    loaded app when authorized.
  - Record candidate, environment, what ran, what failed or was blocked, and evidence. Tests alone do not demonstrate
    the requested behavior.
  - Never turn missing access, unknown effects, or a failed attempt into a pass; identify the exact unproved gap.
  policy_refs:
  - real_behavior
  - authority
  - truthful_handoff
  depends_on:
  - deliver-tickets
  output_refs:
  - behavior_summary
  success_criteria:
  - The requested behavior was observed in the relevant integrated consumer or loaded app; otherwise record the
    step blocked with the evidence gap.
- id: review-delivery
  title: Independent Review
  purpose: Have someone other than the implementer challenge the exact candidate and observations.
  instructions:
  - Give the reviewer the original request, exact candidate, changed docs, sanity observations, failures, and gaps.
  - Reviewer checks the actual diff and consumer path, identifies missing behavior or unnecessary machinery, and
    does not claim authenticated effects from self-written summaries.
  - Required repairs return to the affected implementation or verification step through existing recovery, with
    affected workers quiescent; reverify and review the updated candidate before handoff.
  policy_refs:
  - independent_review
  - intent_first
  - truthful_handoff
  depends_on:
  - verify-delivery
  output_refs:
  - review_summary
  success_criteria:
  - Independent review approves the exact current candidate; repair or blocked verdict cannot advance handoff.
- id: release-closeout
  title: Handoff
  purpose: Tell the operator exactly what was requested, changed, observed, and still missing.
  instructions:
  - Reconcile run/tracker state with the candidate, review, evidence, failed attempts, and release authority.
  - State original request, changed behavior and docs, actual-flow evidence, gaps, and release state. If the requested
    behavior was not demonstrated, say unfinished.
  - Do not publish, merge, deploy, send, or change persistent access without applicable authority.
  policy_refs:
  - truthful_handoff
  - authority
  depends_on:
  - review-delivery
  output_refs:
  - release_summary
  success_criteria:
  - The requested behavior is demonstrated, independent review approved the exact candidate, and release state is
    truthful; otherwise leave the run blocked.
outputs:
- key: intent_summary
  name: Intent Summary
  type: object
  required: true
  description: Original request, agreed behavior, constraints and open question.
  schema:
    type: object
    required:
    - original_request
    - intended_behavior
    - constraints
    - open_questions
    - status
    properties:
      original_request:
        type: string
        minLength: 1
      intended_behavior:
        type: string
        minLength: 1
      constraints:
        type: array
        items:
          type: string
      open_questions:
        type: array
        maxItems: 0
      status:
        const: clear
- key: implementation_summary
  name: Implementation Summary
  type: object
  required: true
  description: Exact candidate, implemented behavior, documentation and remaining work.
  schema:
    type: object
    required:
    - candidate_ref
    - changes
    - docs
    - remaining_work
    properties:
      candidate_ref:
        type: string
        minLength: 1
      changes:
        type: array
        items:
          type: string
      docs:
        type: array
        items:
          type: string
      remaining_work:
        type: array
        maxItems: 0
- key: behavior_summary
  name: Behavior Summary
  type: object
  required: true
  description: Actual consumer observations; unproved work stays visible.
  schema:
    type: object
    required:
    - candidate_ref
    - observed_behavior
    - evidence_refs
    - gaps
    - status
    properties:
      candidate_ref:
        type: string
        minLength: 1
      observed_behavior:
        type: string
        minLength: 1
      evidence_refs:
        type: array
        items:
          type: string
        minItems: 1
      gaps:
        type: array
        items:
          type: string
      status:
        const: demonstrated
- key: review_summary
  name: Review Summary
  type: object
  required: true
  description: Independent disposition for the exact candidate.
  schema:
    type: object
    required:
    - candidate_ref
    - reviewer
    - verdict
    - findings
    - evidence_refs
    properties:
      candidate_ref:
        type: string
        minLength: 1
      reviewer:
        type: string
        minLength: 1
      verdict:
        const: approve
      findings:
        type: array
        items:
          type: string
      evidence_refs:
        type: array
        items:
          type: string
- key: release_summary
  name: Release Summary
  type: object
  required: true
  description: Truthful original-request handoff and release boundary; summary fields are not authenticated receipts.
  schema:
    type: object
    required:
    - original_request
    - changes
    - observed_behavior
    - evidence_refs
    - gaps
    - status
    - review_ref
    - release_state
    - authority
    properties:
      original_request:
        type: string
        minLength: 1
      changes:
        type: array
        items:
          type: string
      observed_behavior:
        type: string
        minLength: 1
      evidence_refs:
        type: array
        items:
          type: string
        minItems: 1
      gaps:
        type: array
        items:
          type: string
      status:
        const: demonstrated
      review_ref:
        type: string
        minLength: 1
      release_state:
        type: string
        minLength: 1
      authority:
        type: string
        minLength: 1
learning_hooks: []
failure_handling:
- On ambiguous intent, ask the operator and pause affected work; keep unrelated ready work moving.
- On failed checks or unknown effects, preserve evidence and current owner; diagnose before a bounded repair or
  retry.
- Existing runs keep their frozen steps, grants, approvals, outputs, and history. Reopen only affected work through
  the existing recovery path after quiescence.
metadata:
  builtin: true
  run_mode: stackos_run_plan
  artifact_grant_policy: explicit
  workflow_family: sdlc
  baseline: requirements_to_release
  workflow_selection_invariant: lifecycle_intent_requires_run_plan_before_tracker_tickets
  feedback_gatekeeper: main_orchestrator
  agent_subset:
  - delivery
  - delivery-reviewer
  step_ids:
  - scope-work
  - deliver-tickets
  - verify-delivery
  - review-delivery
  - release-closeout
