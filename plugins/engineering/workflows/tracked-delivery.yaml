schema_version: stackos.workflow-template.v1
key: engineering.tracked-delivery
name: Engineering Tracked Delivery
version: 0.7.0
description: StackOS launches separate planning, implementation, code-review and post-approval test-writing sessions,
  then holds completion for observed behavior.
domain: engineering
owner:
  team: StackOS
when_to_use:
- A supplied engineering task needs a StackOS run with separate planning, implementation, review and post-approval
  test-writing sessions.
when_not_to_use:
- An existing frozen plan is already executing; resume that version instead.
inputs:
- key: goal
  name: Goal
  type: string
  required: true
  description: Engineering outcome requested by the user or upstream workflow.
- key: repo_context
  name: Repository Context
  type: object
  required: false
  description: Optional known stack, docs, constraints, or host-agent format supplied by the caller.
- key: observations
  name: Integrated observations
  type: array
  required: false
  description: Predeclared requirement, argv and expected_stdout checks, with optional read_only confinement; executed after test writing and independently reviewed using actual results.
agent_requirements:
- role: planner
  requirement: required
  agent_preset_ref: stackos.sdlc.planning
  purpose: Plan the original requirements in a fresh session; ask on ambiguity.
  applies_to_steps:
  - plan-task
- role: executor
  requirement: required
  agent_preset_ref: stackos.sdlc.delivery
  purpose: Implement and document the plan in a separate session, without tests.
  applies_to_steps:
  - implement-task
- role: reviewer
  requirement: required
  agent_preset_ref: stackos.sdlc.delivery-reviewer
  purpose: Review original requirements and actual code in a fresh session, without the executor report.
  applies_to_steps:
  - review-task
- role: test-writer
  requirement: required
  agent_preset_ref: stackos.sdlc.test-writer
  purpose: Write relevant tests in a fresh session only after reviewer approval.
  applies_to_steps:
  - write-tests
skill_preset_requirements:
- skill_preset_ref: stackos.sdlc.delivery-orchestrator
  requirement: required
  purpose: Keep the StackOS controller focused on four separate role sessions and truthful outcome evidence.
  applies_to_steps:
  - plan-task
  - implement-task
  - review-task
  - write-tests
  - handoff
  setup_notes:
  - Models resolve from task overrides, then project extension agent_models, then the requested Astra/Luna defaults.
  - New plans use this version only after installation; existing run plans remain frozen.
policies:
- key: original_intent
  kind: requirements
  description: Use the original requirements; stop affected work and ask Adi if intended behavior is ambiguous.
- key: distinct_sessions
  kind: orchestration
  description: StackOS launches planner, executor, reviewer and test writer as four separate sessions with configured
    models.
- key: actual_code_review
  kind: review
  description: The fresh reviewer receives original requirements and actual changed code, not the executor report;
    rejection blocks tests.
- key: post_review_tests
  kind: verification
  description: Only a fresh test-writer session after reviewer approval may add tests for the approved logic.
- key: truthful_outcome
  kind: delivery
  description: Record prompts, progress, issues, slop, times and failures in the run; completion needs observed
    actual behavior, not test-green or a self-report.
- key: authority
  kind: boundary
  description: Preserve project rules, approval gates and unknown effects; no workflow result grants publication
    or deployment.
steps:
- id: plan-task
  title: Plan Requirements
  purpose: Get one plan from a fresh configured planner session.
  instructions:
  - Supply the original task and requirements to Astra by default; record the exact prompt, model, session, plan,
    timing and ambiguity.
  - Stop and ask Adi if intended behavior is unclear.
  input_refs:
  - goal
  - repo_context
  policy_refs:
  - original_intent
  - distinct_sessions
  - authority
  output_refs:
  - plan_receipt
  success_criteria:
  - A distinct planner session returned a concrete plan with clear intent.
- id: implement-task
  title: Implement Plan
  purpose: A separate configured executor implements and documents the accepted plan.
  depends_on:
  - plan-task
  instructions:
  - Start Luna by default in a clean isolated worktree with the original requirements and recorded plan.
  - Do not write tests before independent review; capture the actual changed code and digest.
  policy_refs:
  - distinct_sessions
  - authority
  output_refs:
  - implementation_receipt
  success_criteria:
  - The executor completed with changed implementation code and no test changes.
- id: review-task
  title: Review Actual Code
  purpose: A fresh reviewer assesses actual code against original requirements.
  depends_on:
  - implement-task
  instructions:
  - Start a new Astra session by default, distinct from the planner and executor.
  - Input contains original requirements and actual changed code only, never the executor report, plan, host guidance or proposed checks.
  - Preserve bounded outcome-scoped command and image inspection through a verified read-restricted profile; refuse unsafe fallback.
  - Record missing requirements, irrelevant changes and rejected logic; rejection blocks test writing.
  policy_refs:
  - original_intent
  - distinct_sessions
  - actual_code_review
  output_refs:
  - review_receipt
  success_criteria:
  - A fresh reviewer approved the exact code digest with no missing or irrelevant work.
- id: write-tests
  title: Write Approved Tests
  purpose: A fresh configured test writer adds tests only after approval.
  depends_on:
  - review-task
  instructions:
  - Start a new Luna session by default after the review step is successful.
  - Write relevant tests for approved implementation logic; do not change that logic.
  policy_refs:
  - distinct_sessions
  - post_review_tests
  output_refs:
  - test_receipt
  success_criteria:
  - A fresh test-writer session added relevant tests without changing reviewed implementation.
- id: handoff
  title: Observed Outcome
  purpose: Report actual behavior and unresolved gaps without false completion.
  depends_on:
  - write-tests
  instructions:
  - Compare actual integrated behavior with each original requirement; passing tests and agent reports alone are
    insufficient.
  - Resume the same isolated reviewer with actual executed argv/output/exit evidence only, and require approval of actual requirement coverage.
  - Record final outcome, issue and failure history, artifacts and release authority. Hold the step if actual behavior
    has not been observed.
  policy_refs:
  - truthful_outcome
  - authority
  output_refs:
  - outcome_receipt
  success_criteria:
  - The requested outcome was observed and the truthful final record is complete.
outputs:
- key: plan_receipt
  name: Plan Receipt
  type: object
  required: true
  description: Daemon-recorded role execution; text remains reported evidence, not an authenticated identity proof.
  schema:
    type: object
    required:
    - thread_id
    - model
    - status
    - prompt
    - started_at
    - ended_at
    - duration_seconds
    - answer
    properties:
      thread_id: &id001
        type: string
        minLength: 1
      model: &id002
        type: string
        minLength: 1
      status: &id003
        const: complete
      prompt: &id004
        type: string
        minLength: 1
      started_at: &id005
        type: string
        minLength: 1
      ended_at: &id006
        type: string
        minLength: 1
      duration_seconds: &id007
        type: number
        minimum: 0
      answer:
        type: object
        required:
        - status
        - plan
        properties:
          status:
            const: complete
          plan:
            type: string
            minLength: 1
- key: implementation_receipt
  name: Implementation Receipt
  type: object
  required: true
  description: Daemon-recorded role execution; text remains reported evidence, not an authenticated identity proof.
  schema:
    type: object
    required:
    - thread_id
    - model
    - status
    - prompt
    - started_at
    - ended_at
    - duration_seconds
    - answer
    - code_sha256
    - changed_paths
    properties:
      thread_id: *id001
      model: *id002
      status: *id003
      prompt: *id004
      started_at: *id005
      ended_at: *id006
      duration_seconds: *id007
      answer: &id008
        type: object
      code_sha256:
        type: string
        minLength: 64
      changed_paths:
        type: array
        minItems: 1
        items:
          type: string
- key: review_receipt
  name: Review Receipt
  type: object
  required: true
  description: Daemon-recorded role execution; text remains reported evidence, not an authenticated identity proof.
  schema:
    type: object
    required:
    - thread_id
    - model
    - status
    - prompt
    - started_at
    - ended_at
    - duration_seconds
    - answer
    - verdict
    - code_sha256
    properties:
      thread_id: *id001
      model: *id002
      status: *id003
      prompt: *id004
      started_at: *id005
      ended_at: *id006
      duration_seconds: *id007
      answer:
        type: object
        required:
        - verdict
        - findings
        - missing_requirements
        - irrelevant_changes
        properties:
          verdict:
            const: approve
          findings:
            type: array
            maxItems: 0
          missing_requirements:
            type: array
            maxItems: 0
          irrelevant_changes:
            type: array
            maxItems: 0
      verdict:
        const: approve
      code_sha256:
        type: string
        minLength: 64
- key: test_receipt
  name: Test Receipt
  type: object
  required: true
  description: Daemon-recorded role execution; text remains reported evidence, not an authenticated identity proof.
  schema:
    type: object
    required:
    - thread_id
    - model
    - status
    - prompt
    - started_at
    - ended_at
    - duration_seconds
    - answer
    - changed_paths
    properties:
      thread_id: *id001
      model: *id002
      status: *id003
      prompt: *id004
      started_at: *id005
      ended_at: *id006
      duration_seconds: *id007
      answer: *id008
      changed_paths:
        type: array
        minItems: 1
        items:
          type: string
- key: outcome_receipt
  name: Observed Outcome
  type: object
  required: true
  description: Controller-executed integrated observations after approval, not caller-authored completion evidence.
  schema:
    type: object
    required:
    - original_requirements
    - observed_behavior
    - evidence_refs
    - gaps
    - status
    properties:
      original_requirements:
        type: string
        minLength: 1
      observed_behavior:
        type: string
        minLength: 1
      evidence_refs:
        type: array
        minItems: 1
        items:
          type: string
      gaps:
        type: array
        maxItems: 0
      status:
        const: demonstrated
failure_handling:
- The original designer attributes each failure using durable evidence and compares its cause with every prior episode; only a demonstrably distinct failure gets a new budget. Reviewers receive no recovery history.
- Ordinary workers use verified private hosts with read-only filtered command views, private scratch and no network; only the synchronous broker edits the actual repository. Preserve requested/resolved model evidence and exact private hosts for resumed threads.
- Reconcile all prior worker and observation effects before consuming recovery allowance or reopening. Positive scope and closed broker custody support local failure recovery; unknown interruption effects remain held. Use an installed controller outside the candidate repository.
- Frozen recovery policy bounded-recovery-v3 uses typed path-value digest and test archives; older schemas hold for explicit reconciliation.
- Inspect canonical handoff and continuation checkpoints before claiming or dispatching; blocked or uncertain state is never permission to replay.
- Failed observations reach read-only designer triage. Optional read_only confinement provides verified no-write/no-network execution; omitted confinement preserves authorized unconfined commands. Automatic replay requires positive confinement, settled custody and clear authority; unconfined or uncertain effects remain held.
- Archive prior results in engineering_recovery metadata before reopening the same plan and run. Consume dispatch budgets before workers start.
- Keep task model overrides above project agent_models above defaults for original, resumed and replacement agents.
- Retire only verified controller-owned test deltas after archiving their exact contents; obtain fresh approval for changed implementation before new tests.
- Authority denials are never retried or bypassed; unresolved effects are inspected and held for operator reconciliation.
- Ambiguous requirements stop the affected step for Adi; no implementation launch.
- Reconcile each semantic failure before recovery. Retry a settled execution failure once in the literal executor thread; recurrence returns to the original designer for stop, revise, or try_again, with only one final attempt total and a replacement executor. Design revisions retain the designer thread. Wording, phase changes, revision, replacement or apparent resolution never reset a recurrence budget.
- Review rejection blocks the separate test-writer session.
- Existing runs retain their frozen version, steps, grants, outputs and history.
metadata:
  builtin: true
  run_mode: stackos_run_plan
  artifact_grant_policy: explicit
