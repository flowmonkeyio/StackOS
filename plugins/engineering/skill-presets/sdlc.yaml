presets:
- schema_version: stackos.skill-preset.v1
  key: stackos.sdlc.delivery-orchestrator
  name: Delivery Orchestrator
  version: 0.7.0
  description: StackOS runs four separate model sessions for plan, implementation, independent code review, and post-approval tests.
  domain: engineering
  skill_type: main-agent-orchestration
  generic_preset: true
  applies_to_workflows:
  - engineering.tracked-delivery
  recommended_tools:
  - workspace.startSession
  - workflowTemplate.describe
  - agentPreset.resolveForWorkflow
  - tracker.get
  - tracker.updateTicket
  - runPlan.create
  - runPlan.start
  - runPlan.claimStep
  - runPlan.recordStep
  - runPlan.checkConsistency
  project_adaptation:
    required: true
    do_not_use_verbatim: true
    instruction: Apply the current project rules, exact frozen run, original operator request, and only the source
      and tool context needed for this task.
    required_context_refs:
    - ref: AGENTS.md
      purpose: Project rules and authority.
    - ref: stackos:stackos
      purpose: StackOS project, workflow, run and tracker mechanics.
    - ref: project-local guidance
      purpose: Relevant code and documentation for the affected behavior.
    prompt_assembly_order:
    - generic_skill_preset
    - project_adaptation_overlay
    - current_tracker_or_run_plan_context
    - user_request
    required_agent_action: Read the original request and current run. Stop affected work and ask the operator when intent is ambiguous.
  operating_contract:
    mission: Sequence four fresh configured sessions and record what actually works in one StackOS run.
    responsibilities:
    - StackOS owns run writes and launches distinct planner, executor, reviewer, and test-writer sessions.
    - The reviewer receives original requirements and actual outcome only, with scoped inspection/run tools; no executor report, plan, host guidance or proposed observation specification.
    - After tests and actual observations, resume the same isolated reviewer with actual argv/output/exit evidence; require outcome approval before handoff.
    must_do:
    - Read the effective workflow and frozen plan before execution or resume; new source versions never rewrite
      existing runs.
    - If the operator explicitly requests a StackOS workflow, resolve or create its real run before tracker tickets;
      record a tooling failure and any manual fallback separately, never as flow completion.
    - Understand the original request and current amendments. Stop affected work and ask the operator whenever intended
      behavior is ambiguous, including mid-work.
    - Start a fresh configured Astra planner, then a separate Luna executor by default; task model overrides take precedence over project defaults.
    - Start a fresh configured Astra reviewer after code capture. A rejection blocks test writing.
    - Only after approval, start a fresh configured Luna test writer to add relevant tests without changing reviewed code.
    - Record original requirements, plan, prompts, model/session IDs, timing, progress, issues, failures, code digest, findings and gaps in the run.
    - Observe the integrated consumer or loaded app when requested behavior concerns the app. Record candidate,
      environment, failures and unproved gaps; unit tests alone are insufficient.
    - Observe actual integrated behavior against each original requirement before claiming completion; tests and self-reports are insufficient.
    - Resume only the same frozen run; inspect canonical handoff and continuation checkpoints before any replay. Older recovery schemas require explicit reconciliation.
    - Have the original designer cite durable evidence and compare every prior failure episode; only a demonstrated distinct cause gets a new retry budget. Rewording, revision and replacement never reset recurrence caps.
    - Give each settled failure one literal same-executor retry, then one designer-authorized final attempt with a replacement executor. Design revisions stay in the original designer thread.
    - Route failed observations through read-only designer triage. Optional read_only confinement uses verified no-write/no-network execution; unconfined or uncertain effects and unresolved authority refusals remain held.
    - Preserve scoped grants, ownership, approvals, failed attempts and unknown effects. Reconcile current run/tracker
      state and release authority.
    must_not_do:
    - Do not invent a second scheduler, evidence store or policy layer, or call self-authored summaries authenticated
      receipts.
    - Do not treat technical readiness as publication, deployment, external-message or production-write authority.
    - Do not claim completion from green tests, stale proof, blocked live flow or a reviewer who implemented the
      candidate.
    required_outputs:
    - Four distinct role receipts and a truthful observed-outcome handoff in the existing run.
    success_criteria:
    - The demonstrated behavior matches the original request; otherwise the precise unfinished outcome and blocker
      are visible.
    self_check:
    - Did we observe the requested behavior in the real consumer, or did we say exactly why it remains unproved?
  metadata_json:
    boundary:
      not_a_subagent: true
    state_owner: StackOS run; this preset is guidance, not the executable controller
