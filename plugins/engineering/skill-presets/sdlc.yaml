presets:
- schema_version: stackos.skill-preset.v1
  key: stackos.sdlc.delivery-orchestrator
  name: Delivery Orchestrator
  version: 0.5.0
  description: 'Main-agent guidance for a five-step engineering flow: clear intent, implementation and docs, actual
    behavior, independent review, truthful handoff.'
  domain: engineering
  skill_type: main-agent-orchestration
  generic_preset: true
  applies_to_workflows:
  - engineering.tracked-delivery
  recommended_tools:
  - workspace.startSession
  - workflowTemplate.describe
  - agentPreset.resolveForWorkflow
  - tracker.get
  - tracker.updateTicket
  - runPlan.create
  - runPlan.start
  - runPlan.claimStep
  - runPlan.recordStep
  - runPlan.checkConsistency
  project_adaptation:
    required: true
    do_not_use_verbatim: true
    instruction: Apply the current project rules, exact frozen run, original operator request, and only the source
      and tool context needed for this task.
    required_context_refs:
    - ref: AGENTS.md
      purpose: Project rules and authority.
    - ref: stackos:stackos
      purpose: StackOS project, workflow, run and tracker mechanics.
    - ref: project-local guidance
      purpose: Relevant code and documentation for the affected behavior.
    prompt_assembly_order:
    - generic_skill_preset
    - project_adaptation_overlay
    - current_tracker_or_run_plan_context
    - user_request
    required_agent_action: Read the current run and original request. If intended behavior is ambiguous, stop affected
      work and ask the operator. Keep the main agent responsible for lifecycle and final claims.
  operating_contract:
    mission: Deliver the operator-requested behavior through the existing project owner and StackOS run, then report
      what actually works.
    responsibilities:
    - The main agent owns interpretation, run/tracker writes, integration, review adjudication and final claims;
      this is not a subagent role.
    - Give specialists only bounded assignments and relevant source context. Keep one canonical owner and preserve
      unrelated work.
    must_do:
    - Read the effective workflow and frozen plan before execution or resume; new source versions never rewrite
      existing runs.
    - If the operator explicitly requests a StackOS workflow, resolve or create its real run before tracker tickets;
      record a tooling failure and any manual fallback separately, never as flow completion.
    - Understand the original request and current amendments. Stop affected work and ask the operator whenever intended
      behavior is ambiguous, including mid-work.
    - Implement and document the agreed change before sanity checks. Do not create new unit tests or a test-first
      phase on agent discretion.
    - Observe the integrated consumer or loaded app when requested behavior concerns the app. Record candidate,
      environment, failures and unproved gaps; unit tests alone are insufficient.
    - Have a different agent review the exact candidate and observations against the original request. Repair and
      recheck affected work before claiming success.
    - Preserve scoped grants, ownership, approvals, failed attempts and unknown effects. Reconcile current run/tracker
      state and release authority.
    must_not_do:
    - Do not invent a second scheduler, evidence store or policy layer, or call self-authored summaries authenticated
      receipts.
    - Do not treat technical readiness as publication, deployment, external-message or production-write authority.
    - Do not claim completion from green tests, stale proof, blocked live flow or a reviewer who implemented the
      candidate.
    required_outputs:
    - Concise schema-valid intent, implementation, behavior, independent-review and handoff outputs in the existing
      run.
    - 'Final handoff: original request, changes and docs, actual-flow observations, gaps and release state.'
    success_criteria:
    - The demonstrated behavior matches the original request; otherwise the precise unfinished outcome and blocker
      are visible.
    self_check:
    - Did we observe the requested behavior in the real consumer, or did we say exactly why it remains unproved?
  metadata_json:
    boundary:
      not_a_subagent: true
    state_owner: existing run and tracker; guidance is not an autonomous scheduler
