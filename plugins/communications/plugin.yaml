  name: Communication Profile
  description: Provider-neutral agent communication identity, guidance, policy, and provider facets for
    chat, email, HubSpot transactional delivery, and future transports.
  schema: *id011
- key: communication-contact
  name: Communication Contact
  description: Safe project-local person, bot, customer, or organization identity linked to provider-specific
    user/email refs.
  schema: *id011
- key: communication-target
  name: Communication Target
  description: Named, policy-checked destination alias that resolves to an explicit provider surface/thread/action
    target, including safe HubSpot contact refs for approved transactional sends.
  schema: *id011
- key: communication-route
  name: Communication Route
  description: Static cross-surface routing policy such as Telegram customer issue to internal Slack channel.
  schema: *id011
- key: communication-membership
  name: Communication Membership
  description: Provider-neutral membership, permission, role, and availability state for profiles or contacts
    inside a communication surface.
  schema: *id011
- key: communication-channel
  name: Communication Channel
  description: Safe communication surface metadata for a Telegram chat/channel, Slack conversation, SMTP
    identity, IMAP mailbox, local chat, or future transport.
  schema: *id011
- key: communication-thread
  name: Communication Thread
  description: Conversation grouping such as a Telegram chat/topic or email thread.
  schema: *id011
- key: communication-message
  name: Communication Message
  description: Normalized inbound or outbound message with local processing and attention state.
  schema: *id011
- key: communication-interaction
  name: Communication Interaction
  description: Provider interaction state for buttons, callbacks, reply controls, and future rich-message
    controls.
  schema: *id011
- key: communication-event
  name: Communication Event
  description: Provider event such as a Telegram edit, HubSpot CRM change, IMAP flag change, SMTP rejection,
    or future delivery webhook.
  schema: *id011
- key: communication-cursor
  name: Communication Cursor
  description: Provider sync state such as Telegram update offset or IMAP UID/UIDVALIDITY cursor.
  schema: *id011
- key: agent-request-source
  name: Agent Request Source
  description: Static allowlist and source metadata for creating generic agent requests from communication
    events.
  schema: *id011
