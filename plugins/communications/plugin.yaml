- key: imap.messages.search
  name: Search IMAP Messages
  description: Search one bounded UID page and report matched_count, has_more and next_after_uid. Continue
    with unchanged mailbox and criteria plus after_uid and the returned UIDVALIDITY as expected_uidvalidity.
  provider: imap
  capability: email-inbox
  risk_level: read
  input_schema:
    type: object
    additionalProperties: false
    required:
    - mailbox_ref
    - limit
    properties:
      mailbox_ref:
        type: string
        maxLength: 253
      cursor_ref:
        type: string
      after_uid:
        type: integer
        minimum: 1
        maximum: 4294967295
        description: Exclusive UID lower bound for continuation; requires expected_uidvalidity from the
          preceding search.
      expected_uidvalidity:
        type: string
        pattern: ^[1-9][0-9]*$
        description: Mailbox UIDVALIDITY from the preceding search. A changed epoch stops continuation
          before searching.
      criteria:
        type: object
        additionalProperties: false
        properties:
          unseen:
            type: boolean
          seen:
            type: boolean
          from:
            type: string
          to:
            type: string
          subject:
            type: string
          text:
            type: string
          since:
            type: string
            pattern: ^\d{1,2}-[A-Za-z]{3}-\d{4}$
          before:
            type: string
            pattern: ^\d{1,2}-[A-Za-z]{3}-\d{4}$
          uid_from:
            type: integer
            minimum: 1
          uid_to:
            oneOf:
            - type: integer
              minimum: 1
            - type: string
              enum:
              - '*'
      limit:
        type: integer
        minimum: 1
        maximum: 500
  output_schema: *id011
  config:
    schema_version: stackos.action.v1
    connector: imap
    operation: messages.search
    requires_credential: true
    docs:
    - docs/integration-contracts/communications.md
    - https://www.rfc-editor.org/rfc/rfc9051.html
- key: imap.message.fetch
  name: Fetch IMAP Message
  description: Fetch selected parsed fields from a bounded MIME prefix by UID. Inspect content_completeness
    for byte and field truncation; use imap.message.export for complete original MIME and attachment evidence.
  provider: imap
  capability: email-inbox
  risk_level: read
  input_schema:
    type: object
    additionalProperties: false
    required:
    - mailbox_ref
    - uid
    properties:
      mailbox_ref:
        type: string
        maxLength: 253
      uid:
        type: integer
      fields:
        type: array
        items:
          type: string
          enum:
          - subject
          - from
          - to
          - cc
          - date
          - message_id
          - text_preview
          - html_preview
          - body_text
          - body_html
          - flags
          - headers
      max_body_bytes:
        type: integer
        minimum: 1
        maximum: 1048576
  output_schema: *id011
  config:
    schema_version: stackos.action.v1
    connector: imap
    operation: message.fetch
    requires_credential: true
    docs:
    - docs/integration-contracts/communications.md
    - https://www.rfc-editor.org/rfc/rfc9051.html
- key: imap.message.export
  name: Export IMAP Message Evidence
  description: Stage one exact IMAP RFC822 message and bounded attachments for a host-owned evidence backend
    without acknowledging the message.
  provider: imap
  capability: email-inbox
  risk_level: write
  input_schema:
    type: object
    additionalProperties: false
    required:
    - mailbox_ref
    - uid
    properties:
      mailbox_ref:
        type: string
        maxLength: 253
      uid:
        type: integer
        minimum: 1
  output_schema:
    type: object
    additionalProperties: false
    required:
    - provider
    - operation
    - status
    - transfer_kind
    - transfer_id
    - staging_uri
    - source_identity
    - raw_mime
    - attachments
    - attachment_count
    - attachment_total_bytes
    properties:
      provider:
        const: imap
      operation:
        const: message.export
      status:
        const: success
      transfer_kind:
        const: imap-staged-evidence.v1
      transfer_id:
        type: string
        pattern: ^[a-f0-9]{32}$
      staging_uri:
        type: string
        pattern: ^/generated-assets/imap-transfers/project-[1-9][0-9]*/[a-f0-9]{32}/$
      source_identity:
        type: object
        additionalProperties: false
        required:
        - provider_key
        - account_ref
        - mailbox_ref
        - uidvalidity
        - uid
        - content_sha256
        properties:
          provider_key:
            const: imap
          account_ref:
            type: string
            minLength: 1
            maxLength: 120
          mailbox_ref:
            type: string
            pattern: ^imap-mailbox:[^\r\n]{1,240}$
          uidvalidity:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
          uid:
            type: integer
            minimum: 1
          content_sha256:
            type: string
            pattern: ^[a-f0-9]{64}$
      raw_mime:
        type: object
        additionalProperties: false
        required:
        - path
        - bytes
        - sha256
        properties:
          path:
            const: original.eml
          bytes:
            type: integer
            minimum: 0
            maximum: 10485760
          sha256:
            type: string
            pattern: ^[a-f0-9]{64}$
      attachments:
        type: array
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required:
          - ordinal
          - path
          - media_type
          - bytes
          - sha256
          properties:
            ordinal:
              type: integer
              minimum: 1
              maximum: 20
            path:
              type: string
              pattern: ^attachment-[0-9]{3}$
            media_type:
              type: string
              maxLength: 127
              pattern: ^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$
            bytes:
              type: integer
              minimum: 0
              maximum: 8388608
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
      attachment_count:
        type: integer
        minimum: 0
        maximum: 20
      attachment_total_bytes:
        type: integer
        minimum: 0
        maximum: 10485760
  config:
    schema_version: stackos.action.v1
    connector: imap
    operation: message.export
    requires_credential: true
    docs:
    - docs/integration-contracts/communications.md
    - plugins/finance/references/imap-host-handoff-contract.md
    - https://www.rfc-editor.org/rfc/rfc9051.html
- key: imap.message.export.cleanup
  name: Clean Up IMAP Evidence Export
  description: Delete one completed IMAP evidence staging transfer by its opaque transfer id only.
  provider: imap
  capability: email-inbox
  risk_level: write
  input_schema:
    type: object
    additionalProperties: false
    required:
    - transfer_id
    properties:
      transfer_id:
        type: string
