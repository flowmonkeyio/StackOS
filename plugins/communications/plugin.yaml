- key: telegram.message.forward
  name: Telegram Message Forward
  description: Explicit TDLib message forward for a bot or user Account through its project communication
    profile.
  provider: telegram
  capability: messaging
  risk_level: write
  input_schema:
    $defs:
      TelegramOptions:
        additionalProperties: false
        properties:
          disable_notification:
            default: false
            title: Disable Notification
            type: boolean
          protect_content:
            default: false
            title: Protect Content
            type: boolean
          effect_id:
            default: 0
            maximum: 9007199254740991
            minimum: 0
            title: Effect Id
            type: integer
        title: TelegramOptions
        type: object
      TelegramTopic:
        additionalProperties: false
        properties:
          kind:
            enum:
            - thread
            - forum
            - direct_messages
            - saved_messages
            title: Kind
            type: string
          id:
            exclusiveMinimum: 0
            maximum: 9007199254740991
            title: Id
            type: integer
        required:
        - kind
        - id
        title: TelegramTopic
        type: object
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      surface_ref:
        description: TDLib telegram-chat:<signed native id> from chat.list or chat.resolve; positive
          IDs are commonly private chats and negative IDs groups/channels. Do not guess IDs.
        pattern: ^telegram-chat:-?[1-9][0-9]*$
        title: Surface Ref
        type: string
      sender_ref:
        anyOf:
        - pattern: ^(telegram-user:[1-9][0-9]*|telegram-chat:-?[1-9][0-9]*)$
          type: string
        - type: 'null'
        default: null
        description: Optional TDLib sender from chat.sender.list for this destination.
        title: Sender Ref
      from_surface_ref:
        minLength: 1
        title: From Surface Ref
        type: string
      message_ids:
        items:
          exclusiveMinimum: 0
          maximum: 9007199254740991
          type: integer
        maxItems: 100
        minItems: 1
        title: Message Ids
        type: array
      topic:
        anyOf:
        - $ref: '#/$defs/TelegramTopic'
        - type: 'null'
        default: null
      options:
        $ref: '#/$defs/TelegramOptions'
      send_copy:
        default: false
        title: Send Copy
        type: boolean
      remove_caption:
        default: false
        title: Remove Caption
        type: boolean
    required:
    - profile_ref
    - surface_ref
    - from_surface_ref
    - message_ids
    title: TelegramMessageForward
    type: object
  output_schema:
    type: object
    additionalProperties: true
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: message.forward
    requires_credential: true
    enforce_budget: false
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
    execution_mode: background
    durable_delivery: true
    durable_pacing_units_input_field: message_ids
    durable_pacing_json:
      account_interval_seconds: 1.0
      destination_interval_seconds: 1.43
    durable_destination_interval_multipliers_json:
    - destination_ref_prefix: 'telegram-chat:-'
      multiplier: 3.0
    durable_pacing_by_auth_method_json:
    - auth_method_key: tdlib-bot-token
      pacing_json:
        account_interval_seconds: 0.047619
