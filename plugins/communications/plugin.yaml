slug: communications
name: Communications
version: 0.1.1
description: First-party StackOS package for messaging, email send, mailbox/message lifecycle, and agent-trigger
  resources.
display_order: 20
source: builtin
capabilities:
- key: messaging
  name: Messaging
  description: Send and receive chat-style messages from explicit agent inputs.
  kind: utility
- key: email-send
  name: Email Send
  description: Send email through configured providers from explicit agent payloads.
  kind: utility
- key: email-inbox
  name: Email Inbox
  description: Inspect mailbox messages and flags with bounded queries.
  kind: utility
- key: agent-triggering
  name: Agent Triggering
  description: Store inbound provider events as generic claimable agent requests.
  kind: utility
providers:
- key: local-agent-chat
  name: Local Agent Chat
  description: StackOS local conversation surface for direct human-to-agent messages, rich response blocks,
    and interaction events.
  auth_type: none
  config:
    setup_note: Local agent chat stores messages and interactions in StackOS resources; the agent runner
      owns model invocation and decisions.
    setup:
      credential_label: none
      local_setup_note: No external registration is required; this is a local StackOS surface.
      setup_note: Local agent chat stores messages and interactions in StackOS resources; the agent runner
        owns model invocation and decisions.
      fallback_url: http://127.0.0.1:5180/
      fallback_reason: Local StackOS daemon/UI; no vendor registration page exists.
      verified_at: '2026-06-11'
      url_confidence:
        fallback_url: verified
    docs:
    - docs/integration-contracts/communications.md
- key: telegram
  name: Telegram
  description: Telegram bot and user Accounts with one managed TDLib session per Account.
  auth_type: tdlib
  auth_methods:
  - key: tdlib-bot-token
    label: Bot
    auth_type: tdlib-bot-token
    payload_format: json
    config:
      native_authorization: true
      account_kind: bot
    fields:
    - key: bot_token
      label: Bot Token
      type: secret
      secret: true
      required: true
      placeholder: 123456:ABC...
      description: Issued by BotFather for this bot. The installation's Telegram application is configured separately.
    - &id001
      key: proxy_enabled
      label: Use a proxy
      type: boolean
      required: false
      description: Optional. Uses this proxy for the Account's TDLib session. A proxy failure never falls
        back to a direct connection.
    - &id002
      key: proxy_type
      label: Proxy type
      type: select
      required: false
      options:
      - value: socks5
        label: SOCKS5
      - value: http
        label: HTTP
      - value: mtproto
        label: MTProto
    - &id003
      key: proxy_host
      label: Proxy host
      type: text
      required: false
      placeholder: proxy.example.com
      description: Hostname or IP address, without a URL scheme or credentials.
    - &id004
      key: proxy_port
      label: Proxy port
      type: number
      required: false
      description: Required when a proxy is enabled. Use a port between 1 and 65535.
    - &id005
      key: proxy_http_only
      label: HTTP requests only
      type: boolean
      required: false
      description: HTTP proxies only. Leave disabled for HTTP CONNECT tunnel support.
    - &id006
      key: proxy_username
      label: Proxy username
      type: text
      secret: true
      required: false
      description: Optional SOCKS5 or HTTP authentication. Stored encrypted.
    - &id007
      key: proxy_password
      label: Proxy password
      type: text
      secret: true
      required: false
      description: Optional SOCKS5 or HTTP authentication. Stored encrypted.
    - &id008
      key: proxy_secret
      label: MTProto proxy secret
      type: text
      secret: true
      required: false
      description: Required for MTProto proxies. Stored encrypted.
    description: Connect a bot with its BotFather token. A shared Telegram application is configured once.
    permission_verification:
      evidence_source: unavailable
      enforcement: provider_enforced
  - key: tdlib-user-session
    label: User account
    auth_type: tdlib-user-session
    payload_format: json
    config:
      native_authorization: true
      account_kind: user
    fields:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    description: Connect your Telegram user account with a local phone sign-in challenge. A shared Telegram application is configured once.
    permission_verification:
      evidence_source: unavailable
      enforcement: provider_enforced
  config:
    setup_note: Configure one Telegram application for this installation, then create reusable bot or user Accounts with bot token or user authorization,
      and an optional proxy. Attach it explicitly to each project. One TDLib session receives updates
      and sends messages for that Account. Project communication profiles own agent guidance and communication
      policy.
    setup:
      credential_label: Bot token or user authorization
      setup_note: Register a Telegram application at my.telegram.org/apps for a shared API ID and hash once. Each bot also needs
        its own token from BotFather. For a user, complete Telegram's authorization challenge in
        Account setup. Configure an optional SOCKS5, HTTP, or MTProto proxy on the same Account.
        To correct the shared application pair, detach and revoke every Telegram Account;
        revoking the final Account resets the application setting for the next setup.
      homepage_url: https://telegram.org/
      signup_url: https://telegram.org/apps
      console_url: https://my.telegram.org/
      credential_url: https://my.telegram.org/apps
      docs_url: https://core.telegram.org/tdlib
      fallback_url: https://t.me/BotFather
      fallback_reason: Bot tokens are issued in Telegram's BotFather chat.
      verified_at: '2026-09-22'
      url_confidence:
        homepage_url: verified
        signup_url: verified
        console_url: verified
        credential_url: verified
        docs_url: verified
        fallback_url: verified
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
- key: slack-bot
  name: Slack Bot
  description: Slack Web API provider for bot identity, message sends, conversation discovery, membership
    sync, and signed HTTP ingress.
  auth_type: bot-token
  auth_methods:
  - key: bot-token
    label: Bot token and signing secret
    auth_type: bot-token
    payload_format: json
    fields:
    - key: bot_token
      label: Bot Token
      type: secret
      secret: true
      required: true
      placeholder: xoxb-...
    - key: signing_secret
      label: Signing Secret
      type: secret
      secret: true
      required: true
      description: Used by daemon-side Slack Events API and interaction signature verification.
  config:
    setup_note: Store only the Slack bot token and signing secret here. StackOS discovers safe workspace
      and bot identity metadata during credential testing. Agent identity, access, trigger, context, response,
      send, and handoff policy belong to project-scoped communication-profile records with slack-bot provider
      facets.
    setup:
      credential_label: Slack Bot Token and Signing Secret
      setup_note: Create or select a Slack app, configure bot scopes, install it to the workspace, then
        copy the bot token and signing secret into StackOS.
      homepage_url: https://slack.com/
      signup_url: https://slack.com/get-started
      console_url: https://api.slack.com/apps
      credential_url: https://api.slack.com/apps
      billing_url: https://slack.com/pricing
      docs_url: https://docs.slack.dev/
      verified_at: '2026-06-11'
      url_confidence:
        homepage_url: verified
        signup_url: verified
        console_url: verified
        credential_url: verified
        billing_url: verified
        docs_url: verified
    scopes:
    - chat:write
    - app_mentions:read
    - channels:history
    - groups:history
    - im:history
    - mpim:history
    - channels:read
    - groups:read
    - im:read
    - mpim:read
    - im:write
    - mpim:write
    - reactions:write
    - files:write
    deferred_auth_methods:
    - oauth2-install
    deferred_runtime:
    - socket-mode-listener
    docs:
    - docs/integration-contracts/communications.md
    - https://docs.slack.dev/reference/methods/chat.postMessage/
    - https://docs.slack.dev/authentication/verifying-requests-from-slack/
    - https://docs.slack.dev/apis/events-api/
- key: smtp
  name: SMTP
  description: SMTP provider for send-only email. Acceptance by the SMTP server is not delivery or read
    confirmation.
  auth_type: smtp-password
  auth_methods:
  - key: smtp-password
    label: SMTP password
    auth_type: smtp-password
    payload_format: json
    fields:
    - key: password
      label: Password
      type: secret
      secret: true
      required: true
    - key: host
      label: Host
      type: text
      secret: false
      required: true
      placeholder: smtp.example.com
    - key: port
      label: Port
      type: number
      secret: false
      required: true
      placeholder: '587'
    - key: tls_mode
      label: TLS Mode
      type: select
      secret: false
      required: true
      options:
      - label: STARTTLS
        value: starttls
      - label: SSL
        value: ssl
      - label: None
        value: none
    - key: username
      label: Username
      type: text
      secret: false
      required: true
    - key: from_email
      label: From Email
      type: text
      secret: false
      required: true
    - key: from_name
      label: From Name
      type: text
      secret: false
      required: false
    - key: reply_to
      label: Reply To
      type: text
      secret: false
      required: false
    - key: timeout_s
      label: Timeout Seconds
      type: number
      secret: false
      required: false
  config:
    setup_note: SMTP is send-only. Use IMAP or provider webhooks for mailbox read/unread, replies, bounces,
      or delivery events.
    setup:
      credential_label: SMTP host, username, and password or app password
      setup_note: SMTP is a protocol, not one vendor. Use the mailbox provider's SMTP settings or app-password
        page, then enter host, port, TLS mode, username, and password in StackOS.
      docs_url: https://www.rfc-editor.org/rfc/rfc5321.html
      fallback_url: https://www.rfc-editor.org/rfc/rfc5321.html
      fallback_reason: Exact registration, billing, and password pages are mailbox-provider specific.
      verified_at: '2026-06-11'
      url_confidence:
        docs_url: verified
        fallback_url: verified
    deferred_auth_methods:
    - oauth-xoauth2
    docs:
    - docs/integration-contracts/communications.md
    - https://www.rfc-editor.org/rfc/rfc5321.html
    - https://www.rfc-editor.org/rfc/rfc4954
- key: imap
  name: IMAP
  description: IMAP provider for mailbox listing, search, metadata fetch, bounded evidence staging, and
    message flag lifecycle.
  auth_type: imap-password
  auth_methods:
  - key: imap-password
    label: IMAP password
    auth_type: imap-password
    payload_format: json
    fields:
    - key: password
      label: Password
      type: secret
      secret: true
      required: true
    - key: host
      label: Host
      type: text
      secret: false
      required: true
      placeholder: imap.example.com
    - key: port
      label: Port
      type: number
      secret: false
      required: true
      placeholder: '993'
    - key: tls_mode
      label: TLS Mode
      type: select
      secret: false
      required: true
      options:
      - label: SSL
        value: ssl
      - label: STARTTLS
        value: starttls
      - label: None
        value: none
    - key: username
      label: Username
      type: text
      secret: false
      required: true
    - key: default_mailbox
      label: Default Mailbox
      type: text
      secret: false
      required: false
      placeholder: INBOX
    - key: tls_ca_pem
      label: Additional trusted CA certificates (PEM)
      type: textarea
      secret: false
      required: false
      description: Optional public CA certificates for this Account only (maximum 64 KiB). Keep private
        keys out of this field. Default trusted roots, certificate validity checks, and hostname verification
        remain enabled. Clear this field to remove the additional trust.
      placeholder: '-----BEGIN CERTIFICATE-----'
    - key: mailbox_refs
      label: Mailbox Refs
      type: text
      secret: false
      required: false
      placeholder: safe mailbox refs, comma separated
    - key: search_limit
      label: Search Limit
      type: number
      secret: false
      required: false
  config:
    setup_note: IMAP operations must use UIDs and UIDVALIDITY, not sequence-number-only references.
    setup:
      credential_label: IMAP host, username, and password or app password
      setup_note: IMAP is a protocol, not one vendor. Use the mailbox provider's IMAP settings or app-password
        page, then enter host, port, TLS mode, username, and password in StackOS.
      docs_url: https://www.rfc-editor.org/rfc/rfc9051.html
      fallback_url: https://www.rfc-editor.org/rfc/rfc9051.html
      fallback_reason: Exact registration, billing, and password pages are mailbox-provider specific.
      verified_at: '2026-06-11'
      url_confidence:
        docs_url: verified
        fallback_url: verified
    deferred_auth_methods:
    - oauth-xoauth2
    docs:
    - docs/integration-contracts/communications.md
    - https://www.rfc-editor.org/rfc/rfc9051.html
actions:
- key: telegram.identity.get
  name: Telegram Identity Get
  description: Explicit TDLib identity get for a bot or user Account through its project communication
    profile.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
    required:
    - profile_ref
    title: TelegramProfileInput
    type: object
  output_schema:
    type: object
    additionalProperties: true
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: identity.get
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
- key: telegram.chat.list
  name: Telegram Chat List
  description: Read one bounded page of a connected user Account's Main or Archive chats from
    TDLib. The cursor slices TDLib's current ordered list; chat reordering can shift pages.
    No chat messages are stored by this action. Use action.run with response_mode=raw
    and no idempotency key to receive this transient page.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      chat_list:
        default: main
        enum:
        - main
        - archive
        title: Chat List
        type: string
      limit:
        default: 20
        maximum: 50
        minimum: 1
        title: Limit
        type: integer
      cursor:
        anyOf:
        - pattern: ^(main|archive):(?:[1-9][0-9]{0,2}|[1-4][0-9]{3})$
          type: string
        - type: 'null'
        default: null
        title: Cursor
    required:
    - profile_ref
    title: TelegramChatList
    type: object
  output_schema:
    type: object
    additionalProperties: true
    description: Chats contain telegram-chat:<native-id> surface refs that can be passed
      to chat.inspect and message.history. next_cursor is the only supported way to
      continue this ordered list snapshot; do not invent chat IDs.
    examples:
    - chat_list: main
      chats:
      - surface_ref: telegram-chat:123456789
        title: Example private chat
        kind: private
        unread_count: 1
        last_message_ref: telegram-message:123456789:1048576
      next_cursor: main:1
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: chat.list
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    default_output_policy_json:
      mode: transient
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/method/messages.getDialogs
- key: telegram.chat.resolve
  name: Telegram Chat Resolve
  description: Explicit TDLib chat resolve for a bot or user Account through its project communication
    profile. Returns a bounded chat summary. Use action.run with response_mode=raw and no
    idempotency key for this transient read.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      username:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Username
      user_id:
        anyOf:
        - exclusiveMinimum: 0
          maximum: 9007199254740991
          type: integer
        - type: 'null'
        default: null
        title: User Id
      chat_id:
        anyOf:
        - maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        - type: 'null'
        default: null
        title: Chat Id
    required:
    - profile_ref
    title: TelegramChatResolve
    type: object
  output_schema:
    type: object
    additionalProperties: true
    description: The returned surface_ref is the Account-known TDLib chat reference for
      later chat.inspect or approved delivery actions. User Accounts can also read
      message.history for that chat.
    examples:
    - surface_ref: telegram-chat:-1001234567890
      chat:
        surface_ref: telegram-chat:-1001234567890
        title: Example channel
        kind: channel
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: chat.resolve
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    default_output_policy_json:
      mode: transient
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
- key: telegram.chat.inspect
  name: Telegram Chat Inspect
  description: Explicit TDLib chat inspect for a bot or user Account through its project communication
    profile. Returns bounded chat and membership facts. Use action.run with response_mode=raw
    and no idempotency key for this transient read.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      surface_ref:
        description: TDLib telegram-chat:<signed native id> from chat.list or chat.resolve; positive
          IDs are commonly private chats and negative IDs groups/channels. Do not guess IDs.
        pattern: ^telegram-chat:-?[1-9][0-9]*$
        title: Surface Ref
        type: string
    required:
    - profile_ref
    - surface_ref
    title: TelegramDestinationInput
    type: object
  output_schema:
    type: object
    additionalProperties: true
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: chat.inspect
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    default_output_policy_json:
      mode: transient
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
- key: telegram.chat.sender.list
  name: Telegram Chat Sender List
  description: Read the selected and available TDLib sender identities for one chat through
    a connected bot or user Account. Use a returned sender_ref on a later explicit send
    when choosing to post as a channel. Use action.run with response_mode=raw and no
    idempotency key for this transient read.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      surface_ref:
        description: TDLib telegram-chat:<signed native id> from chat.list or chat.resolve; positive
          IDs are commonly private chats and negative IDs groups/channels. Do not guess IDs.
        pattern: ^telegram-chat:-?[1-9][0-9]*$
        title: Surface Ref
        type: string
    required:
    - profile_ref
    - surface_ref
    title: TelegramDestinationInput
    type: object
  output_schema:
    type: object
    additionalProperties: true
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: chat.sender.list
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    default_output_policy_json:
      mode: transient
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
- key: telegram.message.history
  name: Telegram Message History
  description: Read one bounded, newest-first TDLib history page from a known user Account chat. Pass
    next_before_message_id as before_message_id for the next page; a short page is not
    proof of the end. Full text requires include_content. No fetched messages are stored
    as communication resources by this action. Use action.run with response_mode=raw
    and no idempotency key to receive this transient page.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      surface_ref:
        description: TDLib telegram-chat:<signed native id> from chat.list or chat.resolve; positive
          IDs are commonly private chats and negative IDs groups/channels. Do not guess IDs.
        pattern: ^telegram-chat:-?[1-9][0-9]*$
        title: Surface Ref
        type: string
      limit:
        default: 20
        maximum: 50
        minimum: 1
        title: Limit
        type: integer
      before_message_id:
        anyOf:
        - exclusiveMinimum: 0
          maximum: 9007199254740991
          type: integer
        - type: 'null'
        default: null
        title: Before Message Id
      include_content:
        default: false
        title: Include Content
        type: boolean
    required:
    - profile_ref
    - surface_ref
    title: TelegramMessageHistory
    type: object
  output_schema:
    type: object
    additionalProperties: true
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: message.history
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    default_output_policy_json:
      mode: transient
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/method/messages.getHistory
- key: telegram.message.get
  name: Telegram Message Get
  description: Explicit TDLib message get for a bot or user Account through its project communication
    profile. Returns selected text and account-qualified file refs without the full native
    message object. Use action.run with response_mode=raw and no idempotency key for this
    transient read.
  provider: telegram
  capability: messaging
  risk_level: read
  input_schema:
    additionalProperties: false
    properties:
      profile_ref:
        minLength: 1
        title: Profile Ref
        type: string
      surface_ref:
        description: TDLib telegram-chat:<signed native id> from chat.list or chat.resolve; positive
          IDs are commonly private chats and negative IDs groups/channels. Do not guess IDs.
        pattern: ^telegram-chat:-?[1-9][0-9]*$
        title: Surface Ref
        type: string
      message_id:
        exclusiveMinimum: 0
        maximum: 9007199254740991
        title: Message Id
        type: integer
    required:
    - profile_ref
    - surface_ref
    - message_id
    title: TelegramMessageInput
    type: object
  output_schema:
    type: object
    additionalProperties: true
  config:
    schema_version: stackos.action.v1
    connector: telegram
    operation: message.get
    requires_credential: true
    enforce_budget: false
    credential_repair_operation: account.session.connect
    default_output_policy_json:
      mode: transient
    docs:
    - docs/integration-contracts/communications.md
    - https://core.telegram.org/tdlib
- key: telegram.message.send
  name: Telegram Message Send
  description: Explicit TDLib message send for a bot or user Account through its project communication
    profile.
  provider: telegram
  capability: messaging
  risk_level: write
  input_schema:
    $defs:
      TelegramAnimation:
        additionalProperties: false
        properties:
          file:
            $ref: '#/$defs/TelegramFile'
          thumbnail:
            anyOf:
            - $ref: '#/$defs/TelegramFile'
            - type: 'null'
            default: null
          caption:
            default: ''
            title: Caption
            type: string
          format:
            default: plain
            enum:
            - plain
            - markdown
            - html
            title: Format
            type: string
          width:
            default: 0
            minimum: 0
            title: Width
            type: integer
          height:
            default: 0
            minimum: 0
            title: Height
            type: integer
          has_spoiler:
            default: false
            title: Has Spoiler
            type: boolean
          show_caption_above_media:
            default: false
            title: Show Caption Above Media
            type: boolean
          kind:
            const: animation
            title: Kind
            type: string
          duration:
            default: 0
            minimum: 0
            title: Duration
            type: integer
        required:
        - file
        - kind
        title: TelegramAnimation
        type: object
      TelegramAudio:
        additionalProperties: false
        properties:
          file:
            $ref: '#/$defs/TelegramFile'
