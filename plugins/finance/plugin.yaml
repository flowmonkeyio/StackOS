slug: finance
name: Finance Operations
version: 0.8.4
description: Backend-neutral finance workflows and provider transport for a solo US business. StackOS never becomes the finance system of record.
display_order: 18
source: builtin
capabilities:
  - key: stripe-invoicing
    name: Stripe invoicing
    description: Create and deliver a reviewed Stripe invoice through explicit provider actions.
    kind: provider
  - key: stripe-reconciliation
    name: Stripe payment lifecycle evidence
    description: Read safe Stripe payment, fee, refund, and balance evidence for an external finance backend.
    kind: provider
providers:
  - key: stripe
    name: Stripe
    description: Stripe API transport for customers, invoices, payment lifecycle evidence, and balances. It contains no bookkeeping, collections, tax, or approval policy.
    auth_type: api-key
    auth_methods:
      - key: api_key
        label: Stripe API key
        auth_type: api-key
        description: A restricted Stripe secret API key stored only in the local daemon encrypted credential payload.
        payload_format: json
        permission_verification:
          evidence_source: unavailable
          enforcement: provider_enforced
        fields:
          - key: api_key
            label: Stripe secret API key
            type: secret
            secret: true
            required: true
            placeholder: Create a restricted key in the Stripe Dashboard; never paste it into chat.
    config:
      setup_note: Store a restricted Stripe API key in StackOS. Account testing uses the read-only account endpoint; Stripe enforces the key permissions for each action.
      setup:
        credential_label: Stripe restricted API key
        setup_note: In the Stripe Dashboard, create a restricted API key with Product and Price reads for catalog selection and only the customer, invoice, invoice item, payment intent, payment record, charge, balance transaction, refund, and balance reads or writes required by your approved workflows. Connect it through StackOS; never share the key with an agent.
        homepage_url: https://stripe.com/
        signup_url: https://dashboard.stripe.com/register
        console_url: https://dashboard.stripe.com/
        credential_url: https://dashboard.stripe.com/apikeys
        billing_url: https://dashboard.stripe.com/settings/billing
        docs_url: https://docs.stripe.com/api
        fallback_url: https://docs.stripe.com/keys
        fallback_reason: Dashboard key and billing routes are authenticated and may vary by account.
        url_confidence:
          homepage_url: verified
          signup_url: verified
          console_url: verified
          credential_url: verified
          billing_url: directional
          docs_url: verified
          fallback_url: verified
        verified_at: '2026-09-04'
      docs:
        - docs/integration-contracts/stripe.md
        - https://docs.stripe.com/api/authentication
        - https://docs.stripe.com/api/idempotent_requests
actions:
  - key: stripe.customers.create
    name: Create Stripe Customer
    description: Create one Stripe customer from explicit approved details and return an account-bound customer reference.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema: &customer_create_input
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 512, description: Use an exact opaque payload-secret marker so the address is materialized only for provider dispatch.}
        name: {type: string, minLength: 1, maxLength: 256, description: When supplied, use an opaque payload-secret marker rather than plaintext action input.}
        description: {type: string, maxLength: 500, description: When supplied, use an opaque payload-secret marker rather than plaintext action input.}
    output_schema: &stripe_output
      type: object
      additionalProperties: true
    config: &customer_create_config
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe:
        method: POST
        path: /customers
        api_version: 2026-08-26.dahlia
      docs:
        - docs/integration-contracts/stripe.md
        - https://docs.stripe.com/api/customers/create
  - key: stripe.customers.retrieve
    name: Retrieve Stripe Customer
    description: Retrieve one previously discovered Stripe customer by an account-bound reference; return exact billing-detail and ordered invoice custom-field digests for independent readback, with optional sensitive business details. Customer defaults do not rewrite finalized invoice snapshots.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema: &customer_ref_input
      type: object
      additionalProperties: false
      required: [customer_ref]
      properties:
        customer_ref: &opaque_ref {type: string, pattern: '^provider-object:', maxLength: 120}
        include_business_details: &include_business_details {type: boolean, default: false, description: "Return the selected fields under data.business_details (data.items[].business_details for lists). These may contain private business data or grant invoice access; never publish or share beyond the operator-authorized destination. Connector output choice only, not sent to Stripe."}
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/customers/{customer_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/customers/retrieve]
  - key: stripe.customers.update
    name: Update Stripe Customer Billing Details
    description: Update only selected fields of one existing customer. Custom fields replace the entire list; independently retrieve current defaults, preserve every unrelated field in the approved replacement, then retrieve again to verify exact values. Customer defaults do not rewrite existing finalized invoices; independently inspect each invoice snapshot.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema:
      type: object
      additionalProperties: false
      required: [customer_ref]
      anyOf:
        - required: [name]
        - required: [email]
        - required: [phone]
        - required: [address]
        - required: [invoice_settings]
      properties:
        customer_ref: *opaque_ref
        name: {type: string, minLength: 1, maxLength: 256, description: Use an exact opaque payload-secret marker; never pass customer text in plaintext action input.}
        email: {type: string, format: email, maxLength: 512, description: Use an exact opaque payload-secret marker; never pass the customer address in plaintext action input.}
        phone: {type: string, minLength: 1, maxLength: 64, description: Use an exact opaque payload-secret marker; never pass the customer number in plaintext action input.}
        address:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            line1: {type: string, minLength: 1, maxLength: 500, description: Use an exact opaque payload-secret marker.}
            line2: {type: string, minLength: 1, maxLength: 500, description: Use an exact opaque payload-secret marker.}
            city: {type: string, minLength: 1, maxLength: 500, description: Use an exact opaque payload-secret marker.}
            state: {type: string, minLength: 1, maxLength: 500, description: Use an exact opaque payload-secret marker.}
            postal_code: {type: string, minLength: 1, maxLength: 500, description: Use an exact opaque payload-secret marker.}
            country: {type: string, description: Use an exact opaque payload-secret marker for the ISO 3166-1 alpha-2 country code; the connector checks the resolved code.}
        invoice_settings:
          type: object
          additionalProperties: false
          required: [custom_fields]
          properties:
            custom_fields: &stripe_custom_fields
              type: array
              maxItems: 4
              description: Complete ordered replacement of all custom fields, preserving approved unrelated entries. Omit to leave unchanged; an explicit empty list clears all fields. Each name and value must use an exact payload-secret marker.
              items:
                type: object
                additionalProperties: false
                required: [name, value]
                properties:
                  name: {type: string, minLength: 1, maxLength: 40}
                  value: {type: string, minLength: 1, maxLength: 140}
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/customers/{customer_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/customers/update]
  - key: stripe.customers.tax-ids.list
    name: List Stripe Customer Tax IDs
    description: Read one bounded page of one customer's tax IDs, with safe refs, exact value hashes and observed verification status. Exhaust all pages and compare type plus exact value hash before deciding whether an approved identifier is absent; there is no atomic uniqueness guarantee.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [customer_ref]
      properties:
        customer_ref: *opaque_ref
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_cursor: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/customers/{customer_ref}/tax_ids', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/customer_tax_ids/list]
  - key: stripe.customers.tax-ids.create
    name: Create Stripe Customer Tax ID
    description: Create exactly one explicitly approved tax ID after an independently completed duplicate check. The connector performs no lookup, normalization, tax decision or retry. Reuse the exact idempotency key on an authorized retry and independently retrieve the result; creation does not establish verification or update issued invoice snapshots.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema:
      type: object
      additionalProperties: false
      required: [customer_ref, type, value]
      properties:
        customer_ref: *opaque_ref
        type: {type: string, pattern: '^[a-z][a-z0-9_]{1,39}$', description: Explicit Stripe tax ID type key. Stripe authoritatively validates supported types; never infer the type from a business registration number.}
        value: {type: string, minLength: 1, description: Use an exact opaque payload-secret marker for the approved identifier.}
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/customers/{customer_ref}/tax_ids', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/customer_tax_ids/create]
  - key: stripe.customers.tax-ids.retrieve
    name: Retrieve Stripe Customer Tax ID
    description: Independently read one account- and customer-bound tax ID. Report actual provider verification status, including pending, unavailable, unverified or null; do not infer verified from successful creation.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [customer_ref, tax_id_ref]
      properties:
        customer_ref: *opaque_ref
        tax_id_ref: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/customers/{customer_ref}/tax_ids/{tax_id_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/customer_tax_ids/retrieve]
  - key: stripe.customers.list
    name: List Stripe Customers by Exact Email
    description: Return one bounded page of Stripe customers matching one exact email, so an existing customer can be used without a raw provider ID.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 512, description: Use an exact opaque payload-secret marker so the address is materialized only for provider dispatch.}
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_cursor: *opaque_ref
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: /customers, api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/customers/list]
  - key: stripe.products.list
    name: List Stripe Products
    description: Read one bounded catalog page with safe product and default-price references; optionally include product name, description, and unit label.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      properties:
        active: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_cursor: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: /products, api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/products/list]
  - key: stripe.products.retrieve
    name: Retrieve Stripe Product
    description: Read one account-bound product and its default-price reference, with optional selected business details.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [product_ref]
      properties:
        product_ref: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/products/{product_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/products/retrieve]
  - key: stripe.prices.list
    name: List Stripe Prices
    description: Read one bounded catalog page preserving price type, currency and pricing structure; optionally include nickname and lookup key.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      properties:
        product_ref: *opaque_ref
        active: {type: boolean}
        currency: {type: string, pattern: '^[a-z]{3}$'}
        type: {type: string, enum: [one_time, recurring]}
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_cursor: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: /prices, api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/prices/list]
  - key: stripe.prices.retrieve
    name: Retrieve Stripe Price
    description: Read an account-bound price with fixed tier and currency-option expansions; preserve pricing facts without computing totals.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      required: [price_ref]
      properties:
        price_ref: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/prices/{price_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/prices/retrieve]
  - key: stripe.invoices.create
    name: Create Draft Stripe Invoice
    description: Create a Stripe draft invoice in the explicitly approved currency that will later be explicitly finalized and sent.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema: &invoice_create_input
      type: object
      additionalProperties: false
      required: [customer_ref, collection_method, days_until_due, currency]
      properties:
        customer_ref: *opaque_ref
        collection_method: {type: string, enum: [send_invoice]}
        currency: {type: string, pattern: '^[a-z]{3}$', description: Approved invoice currency; do not inherit an account default or infer it from a later line.}
        days_until_due: {type: integer, minimum: 1}
        effective_at: {type: integer, minimum: 0, description: Approved Unix timestamp for the invoice effective date; does not change its creation timestamp.}
        correlation_key: &correlation_key {type: string, pattern: '^[0-9a-f]{32}$', description: Random opaque key for one invoice occurrence; never encode customer or billing data.}
        description: {type: string, maxLength: 500, description: When supplied, use an opaque payload-secret marker rather than plaintext action input.}
    output_schema: *stripe_output
    config: &invoice_create_config
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: /invoices, api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/create]
  - key: stripe.invoices.update
    name: Update Stripe Invoice Presentation
    description: Update an explicit invoice memo (description), footer, complete custom-field list and/or nonempty PaymentIntent method types, subject to Stripe's editability rules. Independently retrieve exact fields afterward. Custom fields are frozen at finalization; most finalized invoices also freeze description. A rejection never authorizes recreation, voiding or resending. None of these settings proves absence of the recipient's Pay online button. This action does not finalize or send.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema:
      type: object
      additionalProperties: false
      required: [invoice_ref]
      anyOf:
        - required: [footer]
        - required: [payment_method_types]
        - required: [description]
        - required: [custom_fields]
      properties:
        invoice_ref: *opaque_ref
        description: {type: string, maxLength: 1500, description: Invoice memo; nonempty text requires an exact opaque payload-secret marker. The literal empty string explicitly clears the memo and contains no private text. Omission leaves it unchanged. Stripe enforces editability.}
        custom_fields: *stripe_custom_fields
        footer: {type: string, minLength: 1, maxLength: 500, description: Invoice footer, for example direct-deposit instructions; use an exact opaque payload-secret marker, never plaintext action input.}
        payment_method_types:
          type: array
          minItems: 1
          uniqueItems: true
          description: Stripe PaymentIntent methods only. An empty list is unsupported. us_bank_account is ACH debit and customer_balance is Stripe-managed bank transfer, neither direct deposit to the operator's business bank. Selecting either does not hide or prove absence of the Pay online button.
          items: {type: string, enum: [card, us_bank_account, customer_balance]}
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/invoices/{invoice_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/update]
  - key: stripe.invoice-items.create
    name: Create Stripe Invoice Item
    description: Add one explicit draft line using either a positive manual amount or an existing account-bound Stripe price and explicit quantity.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema: &invoice_item_create_input
      type: object
      additionalProperties: false
      required: [customer_ref, invoice_ref]
      oneOf:
        - required: [amount, currency, description]
          not:
            anyOf:
              - required: [price_ref]
              - required: [quantity]
        - required: [price_ref, quantity]
          not: {required: [amount]}
      properties:
        customer_ref: *opaque_ref
        invoice_ref: *opaque_ref
        amount: {type: integer, minimum: 1}
        price_ref: *opaque_ref
        quantity: {type: integer, minimum: 0, description: Explicit quantity for an existing-price line; zero is accepted by Stripe.}
        currency: {type: string, pattern: '^[a-z]{3}$'}
        description: {type: string, minLength: 1, maxLength: 500, description: Use an opaque payload-secret marker so line text is materialized only for provider dispatch.}
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: /invoiceitems, api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoiceitems/create]
  - key: stripe.invoice-items.list
    name: List Stripe Invoice Items
    description: Read one bounded page of items for exactly one invoice or customer; descriptions are exact UTF-8 SHA-256 digests by default, with optional scoped business text.
    provider: stripe
    capability: stripe-invoicing
    risk_level: read
    input_schema:
      type: object
      additionalProperties: false
      oneOf:
        - required: [invoice_ref]
        - required: [customer_ref]
      properties:
        invoice_ref: *opaque_ref
        customer_ref: *opaque_ref
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        page_cursor: *opaque_ref
        include_business_details: *include_business_details
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: /invoiceitems, api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoiceitems/list]
  - key: stripe.invoices.finalize
    name: Finalize Stripe Invoice
    description: Finalize one reviewed draft invoice with auto_advance=false; this does not send it.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema: &invoice_ref_input
      type: object
      additionalProperties: false
      required: [invoice_ref]
      properties:
        invoice_ref: *opaque_ref
    output_schema: *stripe_output
    config: &invoice_finalize_config
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/invoices/{invoice_ref}/finalize', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/finalize]
  - key: stripe.invoices.send
    name: Send Stripe Invoice
    description: Request Stripe customer delivery for one finalized invoice; the API has no operator-review recipient override and does not document inheriting Dashboard Email invoice without link. Never use this action to send a review copy or assume a Dashboard-only choice makes this API route no-link. Sandbox/test mode sends no email; an accepted test request is not sent/delivered. Live acceptance is not inbox-delivery proof. Workflow approval and exception policy remain outside the connector.
    provider: stripe
    capability: stripe-invoicing
    risk_level: write
    input_schema: *invoice_ref_input
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/invoices/{invoice_ref}/send', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/send]
  - key: stripe.invoices.mark-paid-out-of-band
    name: Mark Stripe Invoice Paid Out of Band
    description: Mark one verified fully settled invoice paid without creating a Stripe charge. It is never a partial-settlement fallback.
    provider: stripe
    capability: stripe-reconciliation
    risk_level: write
    input_schema:
      type: object
      additionalProperties: false
      required: [invoice_ref]
      properties:
        invoice_ref: *opaque_ref
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/invoices/{invoice_ref}/pay', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/pay]
  - key: stripe.invoices.attach-payment
    name: Attach Stripe Payment to Invoice
    description: Attach exactly one previously verified PaymentIntent or PaymentRecord to one invoice. Allocation and matching decisions remain in the workflow.
    provider: stripe
    capability: stripe-reconciliation
    risk_level: write
    input_schema:
      type: object
      additionalProperties: false
      oneOf:
        - required: [invoice_ref, payment_intent_ref]
        - required: [invoice_ref, payment_record_ref]
      properties:
        invoice_ref: *opaque_ref
        payment_intent_ref: *opaque_ref
        payment_record_ref: *opaque_ref
    output_schema: *stripe_output
    config:
      schema_version: stackos.action.v1
      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: POST, path: '/invoices/{invoice_ref}/attach_payment', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/attach_payment]
  - key: stripe.payment-intents.retrieve
