      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/invoices/{invoice_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/retrieve, https://docs.stripe.com/api/invoices/object, https://docs.stripe.com/expand]
  - key: stripe.invoices.pdf.download
    name: Download Finalized Stripe Invoice PDF
    description: Retrieve the exact account-bound invoice and download its finalized PDF into private temporary local staging. Refuses drafts; never finalizes or sends. Copy the returned local file to external finance evidence storage, verify its SHA-256, then clean up the transfer. The staged file is not a public media artifact or delivery evidence.
