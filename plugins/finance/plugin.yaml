      connector: stripe
      operation: rest.v1
      requires_credential: true
      enforce_budget: false
      stripe: {method: GET, path: '/invoices/{invoice_ref}', api_version: 2026-08-26.dahlia}
      docs: [docs/integration-contracts/stripe.md, https://docs.stripe.com/api/invoices/retrieve, https://docs.stripe.com/api/invoices/object]
  - key: stripe.invoices.pdf.cleanup
