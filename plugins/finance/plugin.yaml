    description: Retrieve one invoice with its current customer expanded, customer snapshot digests, observed due date, footer digest, PaymentIntent method list, and hosted/PDF link availability states. recipient_pay_online_button_state=unverified never proves the button absent; draft_dashboard_link_state=not_exposed_by_stripe_api means no stable saved-draft review link is returned. For a draft PDF, inspect the selected invoice manually in Stripe Dashboard and verify whether its Download PDF action is available. Optional business details include invoice number, memo, customer snapshot name/email and available hosted invoice/PDF URLs; additional billing recipients remain outside API visibility.
